apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  fallback.override: |
    # Force cluster egress resolvers to reachable IPv4 forwarders so nodes with
    # SLAAC / IPv6 DHCP advertisements but missing IPv6 default routes do not
    # stall GitHub, external secret manager, or OAuth fetches.
    forward . 192.168.1.1 1.1.1.1 8.8.8.8 {
      prefer_udp
      max_fails 3
      expire 10s
    }
