apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: google-secret-manager
  labels:
    app.kubernetes.io/name: google-secret-manager
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  provider:
    gcpsm:
      projectID: denmann-production
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/213644201491/locations/global/workloadIdentityPools/denmann-selfhosted-k8s/providers/production-cluster
          serviceAccountRef:
            name: king-mongkut-social-secret-sync
            audiences:
              - //iam.googleapis.com/projects/213644201491/locations/global/workloadIdentityPools/denmann-selfhosted-k8s/providers/production-cluster
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: king-mongkut-social-backend-secret-sync
  labels:
    app.kubernetes.io/name: king-mongkut-social-backend-secret-sync
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: google-secret-manager
    kind: SecretStore
  target:
    name: king-mongkut-social-backend-secret
    creationPolicy: CreateOrMerge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: king-mongkut-social-backend-secret
          app.kubernetes.io/part-of: king-mongkut-social
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
      data:
        MONGODB_URI: "{{ .MONGODB_URI }}"
        ACCESS_TOKEN_SECRET: "{{ .ACCESS_TOKEN_SECRET }}"
        REFRESH_TOKEN_SECRET: "{{ .REFRESH_TOKEN_SECRET }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: king-mongkut-social-backend-secret
        version: latest
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
