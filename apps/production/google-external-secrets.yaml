  labels:
    app.kubernetes.io/name: king-mongkut-social-infra-secret-sync
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: google-secret-manager
    kind: SecretStore
  target:
    name: king-mongkut-social-infra-secret
    creationPolicy: CreateOrMerge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: king-mongkut-social-infra-secret
          app.kubernetes.io/part-of: king-mongkut-social
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
      data:
        MONGO_INITDB_ROOT_USERNAME: "{{ .MONGO_INITDB_ROOT_USERNAME }}"
        MONGO_INITDB_ROOT_PASSWORD: "{{ .MONGO_INITDB_ROOT_PASSWORD }}"
  dataFrom:
