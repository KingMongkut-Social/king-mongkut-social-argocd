apiVersion: v1
kind: ConfigMap
metadata:
  name: king-mongkut-social-backend-config
  labels:
    app.kubernetes.io/name: king-mongkut-social-backend-config
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
data:
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ORIGINS: "https://denmannsolutions.com,https://www.denmannsolutions.com"
  FRONTEND_URL: "https://denmannsolutions.com"
  GOOGLE_REDIRECT_URI: "https://api.denmannsolutions.com/api/v1/auth/google/callback"
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: "none"
  TRUST_PROXY: "1"
  LOG_LEVEL: "info"
  UPLOAD_DIR: "/app/uploads"
  ACCESS_TOKEN_TTL: "15m"
  REFRESH_TOKEN_TTL: "7d"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: king-mongkut-social-app-config
  labels:
    app.kubernetes.io/name: king-mongkut-social-app-config
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  VITE_API_BASE_URL: "https://api.denmannsolutions.com/api/v1"
  FRONTEND_URL: "https://denmannsolutions.com"
  ROOT_DOMAIN: "denmannsolutions.com"
