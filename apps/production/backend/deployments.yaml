apiVersion: apps/v1
kind: Deployment
metadata:
  name: king-mongkut-social-api
  labels:
    app.kubernetes.io/name: king-mongkut-social-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: king-mongkut-social-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: king-mongkut-social-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: king-mongkut-social
    spec:
      serviceAccountName: king-mongkut-social-runtime
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/txngjr/king-mongkut-social-api
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: king-mongkut-social-backend-secret
                  key: MONGODB_URI
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: king-mongkut-social-backend-secret
                  key: ACCESS_TOKEN_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: king-mongkut-social-backend-secret
                  key: REFRESH_TOKEN_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: king-mongkut-social-backend-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: king-mongkut-social-backend-secret
                  key: GOOGLE_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: king-mongkut-social-backend-config
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: king-mongkut-social-uploads
