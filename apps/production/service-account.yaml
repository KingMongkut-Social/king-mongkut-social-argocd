apiVersion: v1
kind: ServiceAccount
metadata:
  name: king-mongkut-social-runtime
  labels:
    app.kubernetes.io/name: king-mongkut-social-runtime
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: king-mongkut-social-secret-sync
  labels:
    app.kubernetes.io/name: king-mongkut-social-secret-sync
    app.kubernetes.io/part-of: king-mongkut-social
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
# ESO requests a short-lived bound token for this identity through the
# Kubernetes TokenRequest API. Pods never need to mount its default token.
automountServiceAccountToken: false
